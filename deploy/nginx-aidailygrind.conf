# nginx site for aidailygrind.com
# On the VM: /etc/nginx/sites-available/aidailygrind (symlinked into sites-enabled/)
# HTTPS (listen 443 + certificate lines) is added by: sudo certbot --nginx -d aidailygrind.com -d www.aidailygrind.com

server {
    listen 80;
    listen [::]:80;
    server_name aidailygrind.com www.aidailygrind.com;

    root /var/www/aidailygrind/public;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(html)$ {
        expires 10m;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    error_log /var/log/nginx/aidailygrind_error.log;
    access_log /var/log/nginx/aidailygrind_access.log;
}
