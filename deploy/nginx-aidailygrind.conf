# nginx site for aidailygrind.com
# On the VM: /etc/nginx/sites-available/aidailygrind (symlinked into sites-enabled/)
# The certificate lines come from: sudo certbot --nginx -d aidailygrind.com -d www.aidailygrind.com

# Real visitor IP behind Cloudflare (used only for the subscribe rate limit)
map $http_cf_connecting_ip $aidailygrind_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    server_name aidailygrind.com www.aidailygrind.com;

    root /var/www/aidailygrind/public;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Subscribe / confirm / unsubscribe (deploy/mailer.py, systemd aidailygrind-mailer)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $aidailygrind_client_ip;
        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
    }

    # Email copies of the edition and the AI voice scripts: read by the mailer from disk, not public
    location ^~ /email/ {
        deny all;
    }
    location ^~ /speech/ {
        deny all;
    }

    # AI voice MP3s, made on the first Listen click (outside the synced web root)
    location ^~ /audio/ {
        alias /var/www/aidailygrind/audio/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(html)$ {
        expires 10m;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|png|jpg|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    error_log /var/log/nginx/aidailygrind_error.log;
    access_log /var/log/nginx/aidailygrind_access.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aidailygrind.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aidailygrind.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.aidailygrind.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = aidailygrind.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name aidailygrind.com www.aidailygrind.com;
    return 404; # managed by Certbot
}
