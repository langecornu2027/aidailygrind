# Security headers for aidailygrind.com
# On the VM: /etc/nginx/snippets/aidailygrind-headers.conf
# Included at the server level AND in every location that has its own add_header
# (nginx drops the server-level headers in a location that sets any add_header).
# HSTS: browsers always use HTTPS for this site, never plain http first.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
