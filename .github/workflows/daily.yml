name: Daily Café IA

on:
  schedule:
    - cron: "30 10 * * *" # every day at 10:30 UTC (6:30 in Québec in summer, 5:30 in winter)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # save the new edition in the repo
  pages: write
  id-token: write

concurrency:
  group: cafe-ia
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m cafe_ia

      - name: Save the edition in the repo
        run: |
          git config user.name "Café IA bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/editions
          git diff --cached --quiet || git commit -m "☕ Café IA for $(TZ=America/Toronto date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
